---
deployment:
  tasks:
    - export DEPLOYPATH=/home/servicescserueta
    # Keep a copy of the SQLite database before touching the schema
    - if [ -f $DEPLOYPATH/database/database.sqlite ]; then /bin/cp $DEPLOYPATH/database/database.sqlite $DEPLOYPATH/database/database.sqlite.bak; fi
    - /usr/local/bin/php $DEPLOYPATH/artisan migrate --force
    - /usr/local/bin/php $DEPLOYPATH/artisan config:clear
    - /usr/local/bin/php $DEPLOYPATH/artisan route:clear
    - /usr/local/bin/php $DEPLOYPATH/artisan view:clear
